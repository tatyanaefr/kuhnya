<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Кухня Артёма</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E4513A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  /* шрифт лежит рядом с игрой: работает без интернета и не обращается к Google */
  @font-face { font-family: "Nunito"; font-weight: 800 900; font-display: swap; src: url(fonts/nunito-cyrillic.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: "Nunito"; font-weight: 800 900; font-display: swap; src: url(fonts/nunito-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  /* три варианта оформления: index.html?theme=1, 2 или 3 */
  :root {
    --wall: #FBE9D7;
    --wall-line: #F3D9C0;
    --wood: #DFA367;
    --wood-edge: #C4844A;
    --ink: #3B2414;
    --ink-soft: #7A5640;
    --card: #FFF8EF;
    --title: #E4513A;
    --font: "Nunito", "Trebuchet MS", sans-serif;
    --red: #E4513A;
    --red-dark: #B43A27;
    --green: #3E9B4F;
    --green-dark: #2C7339;
    --gold: #F6B92B;
    --gold-dark: #C98A00;
  }
  /* Вариант 1 «Клетчатая скатерть» — стол в клетку, контур у всех предметов, деревянные кнопки */
  :root[data-theme="1"] {
    --wall: #FFF3E6; --wall-line: #F5DFC8; --wood: #FCE3D3; --wood-edge: #E39E7C;
    --ink: #4A2C17; --ink-soft: #7A5640; --card: #FFF8EF; --title: #E4513A; --outline: #5A3A22;
  }
  /* Вариант 2 «Розовая кухня» — окно с занавесками, деревянная столешница, розовая скатерть */
  :root[data-theme="2"] {
    --wall: #F9D9E0; --wall-line: #FCE9EE; --wood: #FDE7EE; --wood-edge: #C98A52;
    --ink: #4A2340; --ink-soft: #7D5672; --card: #FFFFFF; --title: #D6336C; --outline: #5C3048;
    --font: "Comfortaa", "Trebuchet MS", sans-serif;
  }
  /* Вариант 3 «Зелёные тарелочки» — кремовый лист в зелёной рамке, продукты в тёмно-зелёных кругах */
  :root[data-theme="3"] {
    --wall: #FBF4E2; --wall-line: #CFE5B0; --wood: #FBF4E2; --wood-edge: #FBF4E2;
    --ink: #233528; --ink-soft: #4E6650; --card: #FFFDF6; --title: #233528; --plate: #2F4B3A;
    --font: "Rubik", "Trebuchet MS", sans-serif;
  }

  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background-color: var(--wall);
    font-family: var(--font);
    color: var(--ink);
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #stage { position: fixed; left: 0; top: 0; width: 1600px; height: 1000px; transform-origin: 0 0; }
  .screen { position: absolute; inset: 0; display: none; z-index: 1; }
  .screen.on { display: block; }
  button { font-family: inherit; color: inherit; }
  button:focus-visible { outline: 6px solid var(--gold); outline-offset: 4px; }

  /* ---------- Первый экран ---------- */
  .big-title {
    position: absolute; left: 0; right: 0; text-align: center; margin: 0;
    font-size: 104px; font-weight: 900; line-height: 1; letter-spacing: -2px;
    color: var(--title);
  }
  #start .big-title { top: 230px; left: 640px; right: 64px; }
  #chefPic {
    position: absolute; left: 96px; top: 96px; width: 520px; height: 880px;
    display: grid; place-items: end center;
  }
  #chefPic img, #chefPic svg { max-width: 100%; max-height: 100%; }
  #play {
    position: absolute; left: 960px; top: 470px; width: 240px; height: 240px;
    border-radius: 50%; border: 0; cursor: pointer; padding: 0;
    background: var(--green); box-shadow: 0 12px 0 var(--green-dark);
    display: grid; place-items: center;
    animation: bob 1.6s ease-in-out infinite;
  }
  #play:active { transform: translateY(8px); box-shadow: 0 4px 0 var(--green-dark); animation: none; }

  /* ---------- Первый экран: три варианта (index.html?start=1, 2 или 3) ---------- */
  #startBack, #startDecor { position: absolute; inset: 0; pointer-events: none; }
  .food { position: absolute; pointer-events: auto; cursor: pointer; animation: float 3.2s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .food.still { animation: none; }
  .food .fi, .food svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  .food .fi.boing { animation: boing .5s ease-out; }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-18px) rotate(4deg); } }
  @keyframes boing { 0% { transform: scale(1); } 30% { transform: scale(1.3) rotate(-10deg); } 60% { transform: scale(.9) rotate(6deg); } 100% { transform: scale(1); } }
  #chefPic.boing img { animation: boing .5s ease-out; }
  #chefPic { cursor: pointer; }

  /* 1 — летающая еда и вывеска на верёвочках */
  #start.v1 .big-title {
    left: 430px; right: auto; width: 740px; top: 64px; padding: 24px 0 30px; box-sizing: border-box;
    background: #C98A52; border: 5px solid var(--outline); border-radius: 28px; color: #FFF3E0; font-size: 88px;
  }
  #start.v1 .big-title::before, #start.v1 .big-title::after { content: ""; position: absolute; top: -69px; width: 10px; height: 64px; background: #8E5A2C; }
  #start.v1 .big-title::before { left: 110px; }
  #start.v1 .big-title::after { right: 110px; }
  #start.v1 #chefPic { left: 595px; top: 230px; width: 410px; height: 690px; }
  #start.v1 #play { left: 1090px; top: 650px; width: 210px; height: 210px; }

  /* 2 — кухонные полки и облачко */
  #start.v2 .big-title { top: 36px; left: 0; right: 0; font-size: 92px; }
  #start.v2 #chefPic { left: 600px; top: 200px; width: 400px; height: 720px; }
  #start.v2 #play { left: 250px; top: 650px; width: 220px; height: 220px; }
  .plank { position: absolute; height: 24px; border-radius: 8px; background: #B87A40; border: 4px solid var(--outline); box-sizing: border-box; }
  .plank::before, .plank::after { content: ""; position: absolute; top: 16px; width: 18px; height: 44px; background: #8E5A2C; border-radius: 0 0 8px 8px; }
  .plank::before { left: 40px; }
  .plank::after { right: 40px; }
  .bubble {
    position: absolute; left: 390px; top: 196px; width: 250px; padding: 16px 16px 14px; box-sizing: border-box;
    background: #FFFFFF; border: 4px solid var(--outline); border-radius: 28px;
    font-size: 30px; font-weight: 900; line-height: 1.15; text-align: center; color: var(--ink);
  }
  .bubble::after {
    content: ""; position: absolute; right: -24px; top: 54px; width: 32px; height: 32px; background: #FFFFFF;
    border-right: 4px solid var(--outline); border-top: 4px solid var(--outline); transform: rotate(45deg) skew(12deg, 12deg);
  }

  /* 3 — солнышко и еда по кругу */
  #start.v3 .big-title { top: 24px; left: 0; right: 0; font-size: 88px; }
  #start.v3 #chefPic { left: 610px; top: 230px; width: 380px; height: 660px; }
  #start.v3 #play { left: 1270px; top: 660px; width: 210px; height: 210px; }
  #sun {
    position: absolute; left: 100px; top: -140px; width: 1400px; height: 1400px; border-radius: 50%;
    background: repeating-conic-gradient(#FFDDB0 0 9deg, transparent 9deg 18deg);
    -webkit-mask: radial-gradient(circle, #000 25%, transparent 68%); mask: radial-gradient(circle, #000 25%, transparent 68%);
    animation: spin 120s linear infinite;
  }
  #orbit { position: absolute; left: 800px; top: 540px; width: 0; height: 0; animation: spin 48s linear infinite; }
  #orbit .food { animation: spin 48s linear infinite reverse; }

  /* ---------- Меню ---------- */
  #menu .big-title { top: 64px; font-size: 88px; }
  #menu .sub { position: absolute; left: 0; right: 0; top: 176px; text-align: center; font-size: 44px; font-weight: 800; color: var(--ink-soft); }
  .dishes { position: absolute; left: 0; right: 0; top: 248px; display: grid; grid-template-columns: repeat(6, 228px); justify-content: center; gap: 24px; }
  .dish-card {
    width: 228px; height: 300px; border: 0; border-radius: 32px; padding: 24px 0 0; cursor: pointer;
    background: var(--card); box-shadow: 0 10px 0 rgba(150, 85, 30, .28);
    display: flex; flex-direction: column; align-items: center;
  }
  .dish-card:active { transform: translateY(6px); box-shadow: 0 4px 0 rgba(150, 85, 30, .28); }
  .dish-card > svg { width: 164px; height: 164px; }
  .dish-card.puz { background: var(--title); }
  .dish-card.puz .name { color: #FFFFFF; }
  .dish-card .name { font-size: 32px; font-weight: 900; line-height: 1; margin-top: 8px; }
  .dish-card .stars { height: 32px; margin-top: 12px; display: flex; gap: 4px; }
  .dish-card .stars svg { width: 30px; height: 30px; }

  /* ---------- Кнопки сверху ---------- */
  .round {
    position: absolute; top: 24px; width: 96px; height: 96px; border-radius: 50%;
    border: 0; padding: 0; cursor: pointer; background: var(--card);
    box-shadow: 0 6px 0 rgba(150, 85, 30, .28);
    display: grid; place-items: center; z-index: 50;
  }
  .round:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(150, 85, 30, .28); }
  .round svg { width: 56px; height: 56px; }
  #homeBtn { left: 24px; }
  #muteBtn { left: 136px; }
  #muteBtn.off .wave { display: none; }
  #muteBtn:not(.off) .cross { display: none; }
  #musicBtn.off .note { opacity: .35; }
  #musicBtn:not(.off) .cross { display: none; }

  /* ---------- кружок-подсказка: что нужно и как это пишется ---------- */
  #hint {
    position: absolute; left: 24px; top: 140px; width: 320px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }
  #hint.off { display: none; }
  #hintCircle {
    width: 192px; height: 192px; border-radius: 50%; background: var(--card);
    border: 8px solid var(--title); box-sizing: border-box;
    display: grid; place-items: center;
  }
  #hintCircle svg { width: 132px; height: 132px; }
  #hintWord {
    font-size: 40px; font-weight: 900; line-height: 1; letter-spacing: 2px;
    color: var(--ink); background: var(--card); border-radius: 16px; padding: 8px 16px 6px; white-space: nowrap;
  }
  #hintWord.long { font-size: 30px; }
  #hint.change #hintCircle, #hint.change #hintWord { animation: popIn .4s ease-out; }

  /* ---------- пазлы ---------- */
  #pmenu .big-title { top: 64px; font-size: 88px; }
  #pmenu .sub { position: absolute; left: 0; right: 0; top: 176px; text-align: center; font-size: 44px; font-weight: 800; color: var(--ink-soft); }
  .pics { position: absolute; left: 0; right: 0; top: 280px; display: grid; grid-template-columns: repeat(3, 344px); justify-content: center; gap: 32px; }
  .pic-card {
    height: 300px; border: 0; border-radius: 32px; padding: 16px; cursor: pointer;
    background: var(--card); box-shadow: 0 10px 0 rgba(150, 85, 30, .28);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .pic-card:active { transform: translateY(6px); box-shadow: 0 4px 0 rgba(150, 85, 30, .28); }
  .pic-card .thumb { width: 312px; height: 234px; border-radius: 16px; overflow: hidden; display: block; }
  .pic-card .thumb canvas { width: 100%; height: 100%; display: block; }
  .pic-card .stars { height: 32px; display: flex; gap: 4px; }
  .pic-card .stars svg { width: 30px; height: 30px; }
  #pboard {
    position: absolute; left: 460px; top: 200px; width: 680px; height: 510px;
    background: rgba(120, 70, 30, .16); border-radius: 8px;
  }
  #pboard canvas { position: absolute; left: 0; top: 0; width: 680px; height: 510px; }
  #pghost { opacity: .35; }
  #plines { transition: opacity .6s; }
  #pfull { opacity: 0; transition: opacity .8s; pointer-events: none; z-index: 900; border-radius: 4px; }
  #pboard.done #plines { opacity: 0; }
  #pboard.done #pfull { opacity: 1; }
  #pword {
    position: absolute; left: 460px; width: 680px; top: 740px; text-align: center;
    font-size: 72px; font-weight: 900; line-height: 1; letter-spacing: 4px; color: var(--title);
    opacity: 0; transition: opacity .6s;
  }
  #pword.on { opacity: 1; }
  .piece { position: absolute; left: 0; top: 0; pointer-events: none; filter: drop-shadow(0 4px 3px rgba(50, 25, 5, .4)); will-change: transform; }
  .piece.lift { filter: drop-shadow(0 14px 10px rgba(50, 25, 5, .4)); }
  .piece.placed { filter: none; }
  .piece.fly { transition: transform .7s cubic-bezier(.3, .8, .3, 1); }
  .piece.snap { transition: transform .16s ease-out; }
  #pdots { position: absolute; left: 460px; width: 680px; top: 140px; display: flex; justify-content: center; gap: 10px; pointer-events: none; }

  #dots { position: absolute; left: 300px; right: 300px; top: 58px; display: flex; justify-content: center; gap: 10px; pointer-events: none; }
  .dot { width: 24px; height: 24px; border-radius: 50%; background: rgba(150, 85, 30, .22); transition: background .25s, transform .25s; }
  .dot.on { background: var(--gold); transform: scale(1.15); }
  .dot.now { background: var(--red); transform: scale(1.3); }

  /* ---------- Кухня ---------- */
  #scene { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; touch-action: none; }
  #shelf {
    position: absolute; left: 0; right: 0; top: 808px; height: 176px;
    display: flex; justify-content: center; align-items: center; gap: 16px;
  }
  .item {
    width: 156px; height: 156px; border-radius: 28px; background: var(--card);
    box-shadow: 0 8px 0 rgba(150, 85, 30, .3);
    display: grid; place-items: center; cursor: grab; touch-action: none;
    transition: opacity .2s, transform .2s;
  }
  .item svg { width: 124px; height: 124px; pointer-events: none; }
  .item.taken { opacity: .25; }
  .item.gone { transform: scale(0); opacity: 0; }
  .item.idle { opacity: .55; }
  .item.new { animation: popIn .4s ease-out backwards; }
  .ghost { position: absolute; left: 0; top: 0; width: 150px; height: 150px; pointer-events: none; z-index: 80; filter: drop-shadow(0 16px 10px rgba(80, 40, 10, .35)); }
  .ghost svg { width: 150px; height: 150px; }

  #doneBtn {
    position: absolute; left: 1420px; top: 600px; width: 150px; height: 150px; border-radius: 50%;
    border: 0; padding: 0; cursor: pointer; background: var(--green); box-shadow: 0 10px 0 var(--green-dark);
    display: none; place-items: center; z-index: 40;
  }
  #doneBtn.on { display: grid; animation: popIn .4s ease-out, bob 1.2s .4s ease-in-out infinite; }
  #doneBtn:active { transform: translateY(6px); box-shadow: 0 4px 0 var(--green-dark); }

  /* ---------- Победа ---------- */
  #win {
    position: absolute; inset: 0; display: none; z-index: 90;
    background: rgba(59, 36, 20, .45);
  }
  #win.on { display: block; }
  .win-card {
    position: absolute; left: 480px; top: 100px; width: 640px; height: 800px;
    background: var(--card); border-radius: 48px;
    display: flex; flex-direction: column; align-items: center;
    animation: winIn .5s cubic-bezier(.3, 1.5, .5, 1);
  }
  .win-stars { margin-top: 40px; display: flex; gap: 8px; }
  .win-stars svg { width: 96px; height: 96px; animation: popIn .5s ease-out backwards; }
  .win-stars svg:nth-child(2) { animation-delay: .15s; margin-top: -24px; }
  .win-stars svg:nth-child(3) { animation-delay: .3s; }
  #winPic { width: 300px; height: 300px; margin-top: 16px; display: grid; place-items: center; }
  #winPic svg, #winPic img { max-width: 100%; max-height: 100%; }
  .win-card h2 { margin: 16px 0 0; font-size: 80px; font-weight: 900; line-height: 1; color: var(--red); }
  .win-card p { margin: 8px 0 0; font-size: 36px; font-weight: 800; color: var(--ink-soft); }
  .win-btns { margin-top: 32px; display: flex; gap: 48px; }
  .win-btns button {
    width: 128px; height: 128px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    display: grid; place-items: center;
  }
  .win-btns button svg { width: 68px; height: 68px; }
  #againBtn { background: var(--green); box-shadow: 0 8px 0 var(--green-dark); }
  #menuBtn { background: var(--gold); box-shadow: 0 8px 0 var(--gold-dark); }
  .win-btns button:active { transform: translateY(5px); box-shadow: none; }
  #confetti { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; pointer-events: none; z-index: 95; }

  /* ---------- Поверни телефон ---------- */
  #rotate {
    position: fixed; inset: 0; z-index: 999; display: none;
    background: var(--wall); color: var(--ink);
    flex-direction: column; align-items: center; justify-content: center; gap: 24px;
    font-size: 28px; font-weight: 900; text-align: center; padding: 16px;
  }
  #rotate svg { width: 160px; height: 160px; animation: turn 2s ease-in-out infinite; }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }

  /* ---------- Анимации ---------- */
  @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes winIn { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0) scale(1); }
    20% { transform: rotate(-9deg) scale(1.1); }
    40% { transform: rotate(8deg) scale(1.1); }
    60% { transform: rotate(-6deg) scale(1.05); }
    80% { transform: rotate(4deg) scale(1.02); }
  }
  .wiggle { animation: wiggle .7s ease-in-out 2; }
  @keyframes steam { 0% { transform: translateY(0) scale(.6); opacity: 0; } 30% { opacity: .75; } 100% { transform: translateY(-130px) scale(1.5); opacity: 0; } }
  @keyframes flick { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(.85, 1.15); } }
  @keyframes shake { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-4px, 2px); } 75% { transform: translate(4px, -2px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
  svg .fb { transform-box: fill-box; transform-origin: center; }
  svg .steam { animation: steam 2.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  svg .flame { animation: flick .35s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  svg .shake { animation: shake .09s linear infinite; }
  svg .spin { animation: spin .5s linear infinite; transform-box: fill-box; transform-origin: center; }
  svg .wiggle { transform-box: fill-box; transform-origin: center; }
  svg .pulse { animation: pulse .8s ease-in-out infinite; }
  @keyframes bub { 0% { transform: scale(0); opacity: 0; } 50% { opacity: .9; } 100% { transform: scale(1.3); opacity: 0; } }
  svg .bub { animation: bub 1.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }

  /* ---------- Варианты 1 и 2: тёмный контур, как у наклеек ---------- */
  :root[data-theme="1"] #world > g, :root[data-theme="2"] #world > g { filter: url(#outline); }
  :root[data-theme="1"] .food svg,
  :root[data-theme="1"] .item svg, :root[data-theme="1"] .ghost svg, :root[data-theme="1"] .dish-card > svg, :root[data-theme="1"] #hintCircle svg, :root[data-theme="1"] #winPic svg,
  :root[data-theme="2"] .item svg, :root[data-theme="2"] .ghost svg, :root[data-theme="2"] .dish-card > svg, :root[data-theme="2"] #hintCircle svg, :root[data-theme="2"] #winPic svg {
    filter: drop-shadow(2.5px 0 0 var(--outline)) drop-shadow(-2.5px 0 0 var(--outline)) drop-shadow(0 2.5px 0 var(--outline)) drop-shadow(0 -2.5px 0 var(--outline));
  }
  :root[data-theme="1"] .item, :root[data-theme="2"] .item, :root[data-theme="1"] .dish-card, :root[data-theme="2"] .dish-card,
  :root[data-theme="1"] .pic-card, :root[data-theme="2"] .pic-card { border: 4px solid var(--outline); box-sizing: border-box; }
  :root[data-theme="1"] #hintCircle { border-color: var(--outline); }
  /* деревянные кнопки в варианте 1 */
  :root[data-theme="1"] .round { border-radius: 24px; background: #C98A52; box-shadow: 0 6px 0 #8E5A2C; border: 4px solid var(--outline); box-sizing: border-box; }
  :root[data-theme="1"] .round svg [fill]:not([fill="none"]) { fill: #FFF3E0; }
  :root[data-theme="1"] .round svg [stroke] { stroke: #FFF3E0; }
  :root[data-theme="1"] .big-title { color: var(--title); -webkit-text-stroke: 3px var(--outline); paint-order: stroke fill; }
  :root[data-theme="2"] .big-title { font-weight: 700; }

  /* ---------- Вариант 3: всё в тёмно-зелёных кругах ---------- */

  whoosh() { noise(.35, .16, "bandpass", 500, 2400, 0, 1.5); },
  ding() { bell(1318, 1.1, .3); bell(1760, 1.1, .2, .14); },
  tick() { tone(1900, 1900, .03, "square", .05); },

  pour() { noise(1.0, .14, "lowpass", 700, 1400, 0, 4); },
  squirt() { noise(.35, .2, "bandpass", 1400, 500, 0, 2); },
  chop() { noise(.05, .35, "highpass", 2200); tone(320, 140, .07, "triangle", .2); },
  roll() { noise(.3, .22, "lowpass", 350, 700); },
  nom() { tone(280, 170, .1, "sine", .45); tone(250, 160, .1, "sine", .45, .15); },
  slurp() { noise(.45, .22, "bandpass", 500, 2000, 0, 3); },

// печём: блюдо улетает в духовку, там горит свет, тикает таймер, «дзинь» — и выезжает обратно
async function bake(S, dish, insideHtml, onBaked, back = dish, ms = 4200) {
  const gen = G.gen;
  const b = dish.getBBox(), cx = b.x + b.width / 2, cy = b.y + b.height / 2;
  const k = Math.min(.9, 250 / b.width);
  dish.classList.add("fb");
  SFX.whoosh();
  // без fill: "forwards" — после анимации блюдо прячем явно, а потом явно показываем
  await dish.animate([{ transform: "none", opacity: 1 }, { transform: `translate(${1250 - cx}px,${514 - cy}px) scale(${k})`, opacity: 0 }], { duration: 650, easing: "ease-in" }).finished;
  dish.style.visibility = "hidden";
  if (gen !== G.gen) return;
  S.ovInside.innerHTML = insideHtml;
  S.ovInside.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300 });
  S.ovHeat.setAttribute("stroke", "#FF5A2E");
  S.ovGlow.classList.add("pulse");
  tween(400, t => S.ovGlow.setAttribute("opacity", .8 * t));
  say("oven_wait");
  const ticker = setInterval(() => SFX.tick(), 500);
  await tween(ms, t => S.ovTimer.setAttribute("stroke-dashoffset", (150.8 * (1 - t)).toFixed(1)), t => t);
  clearInterval(ticker);
  if (gen !== G.gen) return;
  SFX.ding(); say("oven_ding");
  S.ovHeat.setAttribute("stroke", "#5A4A44");
  S.ovGlow.classList.remove("pulse");
  tween(400, t => S.ovGlow.setAttribute("opacity", .8 * (1 - t)));
  S.ovInside.innerHTML = "";
  onBaked && onBaked();
  if (back !== dish) dish.style.display = "none";
  back.style.display = "";
  back.style.visibility = "";
  back.style.opacity = "";
  const bb = back.getBBox(), bx = bb.x + bb.width / 2, by = bb.y + bb.height / 2;
  back.classList.add("fb");
  await back.animate([{ transform: `translate(${1250 - bx}px,${514 - by}px) scale(${Math.min(.9, 250 / bb.width)})`, opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 650, easing: "ease-out" }).finished;
  back.style.visibility = "";
  S.ovTimer.setAttribute("stroke-dashoffset", "150.8");
}

// перелететь из одного места в другое (в координатах кухни)
async function flyTo(el, tx, ty, sx = 1, sy = sx, ms = 650) {
  const b = el.getBBox();
  const cx = b.x + b.width / 2, cy = b.y + b.height / 2;
  // учитываем сдвиг внешней группы
  const m = el.parentNode.getCTM ? el.parentNode.getCTM() : null;
  const wx = m ? m.a * cx + m.e : cx, wy = m ? m.d * cy + m.f : cy;
  el.classList.add("fb");
  SFX.whoosh();
  await el.animate([
    { transform: "none" },
    { transform: `translate(${(tx - wx) / (m ? m.a : 1)}px,${(ty - wy - 120) / (m ? m.d : 1)}px) scale(${(sx + 1) / 2},${(sy + 1) / 2})`, offset: .5 },
    { transform: `translate(${(tx - wx) / (m ? m.a : 1)}px,${(ty - wy) / (m ? m.d : 1)}px) scale(${sx},${sy})` }

}

function pancakeSteps() {
  const s = [];
  for (let n = 0; n < 3; n++) {
    s.push({ kind: "tap", target: "bowl", times: 1, say: n ? "pc_more" : "pc_pour",
      run: async S => {
        S.bowl.classList.add("fb");
        await S.bowl.animate([{ transform: "none" }, { transform: "translate(670px,-210px) rotate(32deg)" }], { duration: 600, easing: "ease-in-out", fill: "forwards" }).finished;
        const st = S_("rect", { x: 1150, y: 420, width: 26, height: 0, rx: 13, fill: "#F5E1A6" }, world);
        SFX.pour();
        S.pc = place(S.panIn, 0, 0, `<ellipse rx="140" ry="46" fill="#F5E1A6"/>`);
        S.pcTop = S_("ellipse", { rx: 140, ry: 46, fill: "#E9B45E", opacity: 0 }, S.pc);
        S.pc.classList.add("fb");
        const grow = S.pc.animate([{ transform: "scale(.1)" }, { transform: "scale(1)" }], { duration: 1100, easing: "ease-out", fill: "backwards" });
        await tween(300, t => st.setAttribute("height", 200 * t));
        await grow.finished;
        await tween(200, t => { st.setAttribute("y", 420 + 200 * t); st.setAttribute("height", 200 * (1 - t)); });
        st.remove();
        S.bowl.animate([{ transform: "translate(670px,-210px) rotate(32deg)" }, { transform: "none" }], { duration: 500, easing: "ease-in-out", fill: "forwards" });
        if (!S.sizzle) { S.sizzle = loopSizzle(); steamOn(S); }
        await say("fry");
        for (let i = 0; i < 7; i++) {
          const b = place(S.pc, rnd(-100, 100), rnd(-26, 26), `<circle r="7" fill="#E6C47A"/>`);
          popIn(b); await sleep(140);
        }
      } });
    s.push({ kind: "tap", target: "pan", times: 1, say: "pc_flip",
      run: async S => {
        const f = flip(S.pc); await sleep(375);
        [...S.pc.querySelectorAll("circle")].forEach(c => c.parentNode.parentNode.remove());
        S.pcTop.setAttribute("opacity", 1);
        G_(S.pc, [[-60, -10], [30, 14], [70, -16], [-20, 22], [-90, 12]].map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="16" ry="7" fill="#D19340"/>`).join(""));
        await f; await sleep(500);
      } });
    s.push({ kind: "tap", target: "pan", times: 1, say: "pc_plate",
      run: async S => {
        const y = 690 - S.stackN * 18;
        await flyTo(S.pc, 790, y, 1.21, 1);
        S.pc.parentNode.remove();
        const g = place(S.stack, 790, y, `<ellipse cy="8" rx="172" ry="46" fill="#C98A3A"/><ellipse rx="170" ry="44" fill="#E9B45E"/>` + [[-80, -6], [20, 12], [90, -10], [-30, -18]].map(([x, yy]) => `<ellipse cx="${x}" cy="${yy}" rx="18" ry="7" fill="#D19340"/>`).join(""));
        S.stackN++; SFX.drop();
        if (S.stackN === 3) { S.sizzle && S.sizzle(); S.sizzle = null; steamOff(S); }
      } });
  }
  return s;
}

function saladCut(veg, say0) {
  return [
    { kind: "drag", item: veg, target: "board", say: say0,
      run: async S => { S.veg = place(world, 430, 636, VEG[veg].whole); SFX.drop(); await dropIn(S.veg, -200); } },
    { kind: "tap", target: "board", times: 3, say: "sl_cut", hint: "cutter",
      enter(S) { S.knife.style.display = ""; popIn(S.knife); },
      onTap(S, i) {
        SFX.chop();
        S.knife.getAnimations().forEach(a => a.cancel());
        S.knife.animate([{ transform: "translateY(0)" }, { transform: "translateY(70px)" }, { transform: "translateY(0)" }], { duration: 260, easing: "ease-in-out" });
        S_("line", { x1: -40 + i * 40, y1: -60, x2: -40 + i * 40, y2: 60, stroke: "#FFFFFF", "stroke-width": 5, opacity: .7 }, S.veg);
      },
      run: async S => {
        await sleep(250);
        S.knife.style.display = "none";
        S.veg.innerHTML = VEG[veg].sliced;
        popIn(S.veg, 0, 300);
        await sleep(450);
        await flyTo(S.veg, 1120, 560, .45);
        S.veg.parentNode.remove();
        for (let i = 0; i < 7; i++) S.salad.push(place(S.saladG, rnd(-150, 150).toFixed(0), rnd(-28, 28).toFixed(0), VEG[veg].piece, rnd(-40, 40)));
        SFX.drop();
      } },
  ];
}

const G = { s: 1, gen: 0, loops: [], muted: false, busy: true, step: null, key: null, S: null };
try { G.muted = localStorage.getItem("kuhnya-artema-mute") === "1"; } catch (e) {}

// размер экрана берём у самой страницы: innerWidth на телефоне бывает «отдалённым» и больше экрана
function screenSize() {
  const d = document.documentElement;
  return [d.clientWidth || innerWidth, d.clientHeight || innerHeight];
}
function fit() {
  const [W, H] = screenSize(), s = Math.min(W / 1600, H / 1000);
  const ox = (W - 1600 * s) / 2, oy = (H - 1000 * s) / 2;
  G.s = s;
  stage.style.transform = `translate(${ox}px,${oy}px) scale(${s})`;
  const split = oy + 560 * s, b = document.body.style, n = THEME_N, px = v => (v * s).toFixed(2) + "px";
  const below = H - split;
  if (n === "3") {
    // светло-зелёная рамка, внутри — кремовый лист (рисует #stage::before)
    b.backgroundImage = "none"; b.backgroundColor = "#CFE5B0";
    return;
  }
  b.backgroundColor = "var(--wall)";
  const layers = [], sizes = [], pos = [];
  const add = (img, size, p) => { layers.push(img); sizes.push(size); pos.push(p); };
  // вертикальные полосы сдвигаем в такт кухне, но слой растягиваем на всю ширину окна
  const vx = (period, y, h) => { const P = period * s; return [`calc(100% + ${P}px) ${h}px`, `${(ox % P) - P}px ${y}px`]; };
  if (n === "1") {
    // скатерть в клетку
    add(`linear-gradient(var(--wood-edge), var(--wood-edge))`, `100% ${px(12)}`, `0 ${split}px`);
    add(`repeating-linear-gradient(90deg, rgba(232,120,90,.28) 0 ${px(40)}, transparent ${px(40)} ${px(80)})`, ...vx(80, split, below));
    add(`repeating-linear-gradient(0deg, rgba(232,120,90,.28) 0 ${px(40)}, transparent ${px(40)} ${px(80)})`, `100% ${below}px`, `0 ${split}px`);
    add(`linear-gradient(var(--wood), var(--wood))`, `100% ${below}px`, `0 ${split}px`);
    // плитка на стене
    add(`repeating-linear-gradient(90deg, var(--wall-line) 0 ${px(4)}, transparent ${px(4)} ${px(100)})`, ...vx(100, 0, split));
    add(`repeating-linear-gradient(0deg, var(--wall-line) 0 ${px(4)}, transparent ${px(4)} ${px(100)})`, `100% ${split}px`, `0 ${split - 4 * s}px`);
  } else {
    // деревянная столешница и розовая скатерть в клетку, на стене — полоски
    add(`linear-gradient(var(--wood-edge), var(--wood-edge))`, `100% ${px(36)}`, `0 ${split}px`);
    add(`repeating-linear-gradient(90deg, rgba(236,110,150,.26) 0 ${px(34)}, transparent ${px(34)} ${px(68)})`, ...vx(68, split, below));
    add(`repeating-linear-gradient(0deg, rgba(236,110,150,.26) 0 ${px(34)}, transparent ${px(34)} ${px(68)})`, `100% ${below}px`, `0 ${split}px`);
    add(`linear-gradient(var(--wood), var(--wood))`, `100% ${below}px`, `0 ${split}px`);
    add(`repeating-linear-gradient(90deg, var(--wall-line) 0 ${px(28)}, transparent ${px(28)} ${px(56)})`, ...vx(56, 0, split));
  }
  b.backgroundImage = layers.join(",");
  b.backgroundSize = sizes.join(",");
  b.backgroundPosition = pos.join(",");
  b.backgroundRepeat = "no-repeat";
}
addEventListener("resize", fit);
// после поворота телефона размеры приходят не сразу — пересчитываем ещё пару раз
addEventListener("orientationchange", () => [100, 400, 900].forEach(ms => setTimeout(fit, ms)));
if (window.visualViewport) visualViewport.addEventListener("resize", fit);
fit();

// координаты кухни из координат экрана
function toStage(cx, cy) { const r = stage.getBoundingClientRect(); return { x: (cx - r.left) / G.s, y: (cy - r.top) / G.s }; }
function rectOf(el) {
  const r = el.getBoundingClientRect(), st = stage.getBoundingClientRect();
  return { x: (r.left - st.left) / G.s, y: (r.top - st.top) / G.s, w: r.width / G.s, h: r.height / G.s };
}
function inside(pt, el, pad = 50) {
  if (!el) return false;
  const r = rectOf(el);
  return pt.x > r.x - pad && pt.x < r.x + r.w + pad && pt.y > r.y - pad && pt.y < r.y + r.h + pad;
}
function centerOf(el) { const r = rectOf(el); return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; }

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  G.screen = id;
  const back = id === "game" || id === "puzzle" || id === "pmenu";
  $("homeBtn").classList.toggle("hide", !back);
  $("muteBtn").style.left = back ? "136px" : "24px";
  $("musicBtn").style.left = back ? "248px" : "136px";
}

function cleanup() {
  G.gen++;
  G.loops.forEach(f => { try { f(); } catch (e) {} });
  G.loops = [];
  stopVoice(); clearHint();
  clearInterval(hintCycle); $("hint").classList.add("off");
  G.holding = false; G.ring = null;
  puzzleClear();
  $("doneBtn").classList.remove("on");
  $("win").classList.remove("on");
  world.innerHTML = "";
  shelf.innerHTML = "";
  G.confettiGen = (G.confettiGen || 0) + 1;
  $("confetti").getContext("2d").clearRect(0, 0, 1600, 1000);
}

function startRecipe(key) {
  cleanup();
  show("game");
  const R = RECIPES[key];
  G.key = key; G.R = R; G.i = -1; G.used = new Set();
  const S = G.S = { targets: {} };
  setupBites(S);
  R.build(S);
  G.order = [...R.shelf].sort(() => Math.random() - .5);
  $("dots").innerHTML = R.steps.map(() => `<div class="dot"></div>`).join("");
  next();
}

function next() {
  const R = G.R, S = G.S;
  G.i++;
  const st = G.step = R.steps[G.i];
  [...$("dots").children].forEach((d, i) => { d.classList.toggle("on", i < G.i); d.classList.toggle("now", i === G.i); });
  G.taps = 0; G.picks = 0; G.progress = 0; G.busy = false;
  renderShelf();
  showHint(st);
  if (st.enter) st.enter(S);
  if (st.kind === "auto") {
    G.busy = true;
    const gen = G.gen;
    st.run(S).then(() => { if (gen === G.gen) next(); });
    return;
  }
  if (st.kind === "eat" || st.kind === "drink") {
    if (st.kind === "eat") S.targets.dish.setAttribute("mask", "url(#biteMask)");
    say(st.say || st.kind);
    armHint();
    return;
  }
  say(st.say);
  armHint();
}

// шаг сделан: хвалим, проигрываем, что получилось, и дальше
async function complete(run) {
  const gen = G.gen;
  G.busy = true; clearHint();
  $("doneBtn").classList.remove("on");
  const p = praise();
  if (run) await run();
  if (gen !== G.gen) return;
  await Promise.race([p, sleep(1300)]);
  if (gen !== G.gen) return;
  next();
}

// ---------- полка ----------
function shelfIds() {
  const st = G.step;
  const ids = G.order.filter(id => !G.used.has(id));
  if (st && st.kind === "pick") st.items.forEach(id => { if (!ids.includes(id)) ids.push(id); });
  return ids;
}
function wanted(id) {
  const st = G.step;
  return !!st && (st.kind === "drag" && st.item === id || st.kind === "pick" && st.items.includes(id));
}
function renderShelf() {
  const old = new Set([...shelf.children].map(c => c.dataset.id));
  shelf.innerHTML = "";
  for (const id of shelfIds()) {
    const c = document.createElement("div");
    const st = G.step, free = st && (st.kind === "drag" || st.kind === "pick");
    c.className = "item" + (old.has(id) ? "" : " new") + (free || wanted(id) ? "" : " idle");
    c.dataset.id = id;
    c.innerHTML = iconSvg(id);
    c.addEventListener("pointerdown", e => startDrag(e, id, c));
    shelf.appendChild(c);
  }
}
function cardOf(id) { return shelf.querySelector(`[data-id="${id}"]`); }

// ---------- перетаскивание ----------
let drag = null;
function startDrag(e, id, card) {
  e.preventDefault();
  ac();
  bumpHint();
  if (G.busy || drag) return;
  const pt = toStage(e.clientX, e.clientY);
  const gh = document.createElement("div");
  gh.className = "ghost"; gh.innerHTML = iconSvg(id);
  stage.appendChild(gh);
  drag = { id, card, gh, x0: e.clientX, y0: e.clientY, moved: false, pid: e.pointerId };
  moveGhost(pt);
  card.classList.add("taken");
  SFX.pop();
}
function moveGhost(pt) { drag.gh.style.transform = `translate(${pt.x - 75}px,${pt.y - 75}px) scale(1.1)`; drag.pt = pt; }
addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pid) return;
  if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 12) drag.moved = true;
  moveGhost(toStage(e.clientX, e.clientY));
});
addEventListener("pointerup", e => { if (drag && e.pointerId === drag.pid) endDrag(); endHold(); });
addEventListener("pointercancel", e => { if (drag && e.pointerId === drag.pid) endDrag(); endHold(); });

async function endDrag() {
  const d = drag; drag = null;
  const st = G.step, S = G.S;
  const target = st && S.targets[st.target];
  const ok = wanted(d.id) && !G.busy;
  if (ok && (!d.moved || inside(d.pt, target))) {
    // попали! (или просто нажали на нужный продукт — тогда он сам летит куда надо)
    const c = centerOf(target);
    const dropPt = d.moved ? d.pt : null;
    if (st.kind === "drag") G.busy = true;
    await d.gh.animate([{ transform: d.gh.style.transform, opacity: 1 }, { transform: `translate(${(dropPt || c).x - 75}px,${(dropPt || c).y - 75}px) scale(.4)`, opacity: 0 }], { duration: 320, easing: "ease-in" }).finished;
    d.gh.remove();
    if (st !== G.step) return;
    if (st.kind === "drag") {
      G.used.add(d.id);
      d.card.classList.add("gone");
      complete(() => st.run(S));
    } else {
      d.card.classList.remove("taken");
      st.place(S, d.id, dropPt);
      G.picks++;
      bumpHint();
      if (G.picks >= st.max) complete(null);
      else if (G.picks === st.min) { $("doneBtn").classList.add("on"); say("done_btn"); }
      else if (G.picks < st.min) say("more");
    }
    return;
  }
  // не туда — продукт возвращается на полку
  const home = centerOf(d.card);
  if (!ok && (d.moved ? inside(d.pt, target) : true) && !G.busy) {
    say(pick(["later1", "later2", "later3"]));
    setTimeout(() => hintWiggle(), 600);
  } else if (ok) {
    wiggle(target);
  }
  SFX.boing();
  await d.gh.animate([{ transform: d.gh.style.transform }, { transform: `translate(${home.x - 75}px,${home.y - 75}px) scale(1)` }], { duration: 300, easing: "ease-out" }).finished;
  d.gh.remove();
  d.card.classList.remove("taken");
}

// ---------- нажатия на кухне ----------
scene.addEventListener("pointerdown", e => {
  ac();
  bumpHint();
  const st = G.step, S = G.S;
  if (!st || G.busy || drag) return;
  const pt = toStage(e.clientX, e.clientY);
  const target = S.targets[st.target];
  const hit = inside(pt, target, 20);
  if (st.kind === "tap") {
    if (!hit) { wiggle(target); return; }
    const i = G.taps++;
    st.onTap && st.onTap(S, i, pt);
    if (G.taps >= st.times) { G.busy = true; const gen = G.gen; setTimeout(() => { if (gen === G.gen) complete(st.run && (() => st.run(S))); }, st.times > 1 ? 450 : 0); }
  } else if (st.kind === "mix") {
    if (!hit) { wiggle(target); return; }
    startHold();
  } else if (st.kind === "eat") {
    if (!hit) return;
    eatBite(pt);
  } else if (st.kind === "drink") {
    if (!hit) return;
    sip();
  } else if (st.kind === "drag" || st.kind === "pick") {
    if (hit) hintWiggle();
  }
});

// ---------- «нажми и держи» ----------
function startHold() {
  const st = G.step, S = G.S;
  if (G.holding) return;
  G.holding = true;
  G.progress = Math.min(1, G.progress + .05);
  if (!G.ring) {
    const r = rectOf(S.targets[st.target]);
    G.ring = G_(world, `<circle r="40" fill="#FFF8EF"/><circle r="30" fill="none" stroke="#F3E3D0" stroke-width="12"/>`, { transform: `translate(${r.x + r.w + 10} ${r.y + 40})` });
    G.ringFg = S_("circle", { r: 30, fill: "none", stroke: "#3E9B4F", "stroke-width": 12, "stroke-linecap": "round", "stroke-dasharray": 188.5, "stroke-dashoffset": 188.5, transform: "rotate(-90)" }, G.ring);
  }
  G.motorStop = st.motor ? loopMotor(st.motor) : stirSound();
  (S[st.shake] || S.targets[st.target]).classList.add("shake");
  st.start && st.start(S);
  let last = performance.now();
  const gen = G.gen;
  (function loop(now) {
    if (gen !== G.gen || !G.holding) return;
    G.progress = Math.min(1, G.progress + (now - last) / st.ms);
    last = now;
    st.progress && st.progress(S, G.progress);
    if (S.swirl) S.swirl.style.transform = `rotate(${now / 2.5}deg)`;
    G.ringFg.setAttribute("stroke-dashoffset", (188.5 * (1 - G.progress)).toFixed(1));
    if (G.progress >= 1) { endHold(); G.ring.remove(); G.ring = null; complete(() => st.run(S)); return; }
    requestAnimationFrame(loop);
  })(last);
}
function endHold() {
  if (!G.holding) return;
  G.holding = false;
  const st = G.step, S = G.S;
  G.motorStop && G.motorStop(); G.motorStop = null;
  const el = S[st.shake] || S.targets[st.target];
  el && el.classList.remove("shake");
  st.stop && st.stop(S);
}
// звук венчика — стучит по миске
function stirSound() {

function eatBite(pt) {

  if (G.taps % 3 === 0 && G.taps < st.bites) say(pick(["yum1", "yum2", "yum3"]));

}
function sip() {
  const S = G.S, st = G.step;
  G.taps++;

    SFX.nom();
    st.drain(S, G.taps / st.sips);
    if (G.taps % 3 === 0 && G.taps < st.sips) say(pick(["yum1", "yum2", "yum3"]));
    if (G.taps >= st.sips) { G.busy = true; setTimeout(() => win(), 600); }
    return;
  }
  SFX.slurp();

}

const NOTE = n => {
  const m = /^([A-G])(\d)$/.exec(n);
  const k = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]];
  return 440 * Math.pow(2, (k - 9) / 12 + (+m[2] - 4));

// 8 тактов по 8 восьмушек, «-» — пауза
const TUNE = [
  "E5 - G5 - A5 G5 E5 -", "D5 - G5 - B4 - D5 -", "C5 - E5 - A5 - G5 E5", "F5 - A5 - G5 - - -",
  "E5 G5 C6 - B5 A5 G5 -", "D5 - B4 - D5 G5 - -", "A5 - G5 F5 E5 - D5 -", "C5 - E5 - C5 - - -",
].join(" ").split(" ");
const BASS = ["C3", "G2", "A2", "F2", "C3", "G2", "F2", "C3"];
const CHORD = { C3: ["C4", "E4", "G4"], G2: ["B3", "D4", "G4"], A2: ["A3", "C4", "E4"], F2: ["A3", "C4", "F4"] };
const EIGHTH = .3;
function mNote(f, t, vol, dur, type = "sine") {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + .01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(MUSIC.gain); o.start(t); o.stop(t + dur + .05);
}
function musicTick() {
  if (!MUSIC.gain) return;
  while (MUSIC.t < AC.currentTime + .5) {
    const i = MUSIC.i % TUNE.length, bar = Math.floor(i / 8), slot = i % 8, t = MUSIC.t;
    if (TUNE[i] !== "-") { mNote(NOTE(TUNE[i]), t, .16, .55); mNote(NOTE(TUNE[i]) * 4, t, .025, .12); }
    if (slot === 0 || slot === 4) mNote(NOTE(BASS[bar]), t, .2, .5, "triangle");
    if (slot === 2 || slot === 6) CHORD[BASS[bar]].forEach(c => mNote(NOTE(c), t, .045, .35));
    MUSIC.t += EIGHTH; MUSIC.i++;
  }
}

  if (!MUSIC.on || G.muted || MUSIC.timer) return;
  const a = ac();
  MUSIC.gain = a.createGain(); MUSIC.gain.gain.value = .5; MUSIC.gain.connect(a.destination);
  MUSIC.t = a.currentTime + .15; MUSIC.i = 0;
  MUSIC.timer = setInterval(musicTick, 150);

}

const balloon = (x, y, c) => `<path d="M${x} ${y + 52} q-6 40 6 80" stroke="#8A7A6A" stroke-width="3" fill="none"/><ellipse cx="${x}" cy="${y}" rx="38" ry="48" fill="${c}"/><ellipse cx="${x - 12}" cy="${y - 18}" rx="9" ry="14" fill="#fff" opacity=".45"/><path d="M${x - 6} ${y + 46} h12 l-6 10z" fill="${c}"/>`;
const PUZZLES = {
  pizza: { word: "ПИЦЦА", say: "puz_pizza", svg: () => checks("#FFF3E6", "#F28B74") + gDish("pizza", 340, 255, 2.2) + gIcon("tomato", 70, 80, 1.1, -15) + gIcon("cheese", 610, 80, 1.1, 10) + gIcon("mushroom", 70, 440, 1.1, 10) + gIcon("salami", 610, 440, 1.1) },
  burger: { word: "БУРГЕР", say: "puz_burger", svg: () => `<rect width="680" height="510" fill="#8FD0F0"/>` + rays(340, 255, "#B5E2F7") + gDish("burger", 340, 250, 2.3) + gIcon("ketchup", 80, 400, 1.2, -10) + gIcon("pickle", 600, 410, 1.2) + gIcon("tomato", 600, 90, 1) + gIcon("lettuce", 80, 90, 1.1) },
  cake: { word: "ТОРТИК", say: "puz_cake", svg: () => `<rect width="680" height="510" fill="#FCE4EC"/>` + [[60, 50, 18], [150, 420, 14], [520, 470, 16], [300, 40, 10], [450, 70, 14]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#F8BBD0"/>`).join("") + balloon(90, 130, "#6EC1E4") + balloon(590, 110, "#F7CF45") + balloon(600, 290, "#E4513A") + gDish("cake", 340, 280, 2.2) },
  pancakes: { word: "БЛИНЧИКИ", say: "puz_pancakes", svg: () => checks("#FFF6D8", "#F6D46E", 50) + gDish("pancakes", 340, 260, 2.3) + gIcon("honey", 80, 100, 1.2, -8) + gIcon("strawberry", 600, 100, 1.1, 12) + gIcon("blueberry", 600, 420, 1.1) + gIcon("jam", 80, 420, 1.1) },
  smoothie: { word: "КОКТЕЙЛЬ", say: "puz_smoothie", svg: () => `<rect width="680" height="510" fill="#D9F0E8"/>` + rays(340, 255, "#EAF7F2") + gDish("smoothie", 340, 250, 2.3) + gIcon("banana", 90, 110, 1.3, -10) + gIcon("strawberry", 590, 100, 1.2, 10) + gIcon("kiwi", 90, 410, 1.2) + gIcon("orange", 590, 410, 1.2) },
  chef: { word: "АРТЁМ", say: "puz_chef", chef: true, svg: () => `<rect width="680" height="510" fill="#FFE0B2"/>` + rays(340, 255, "#FFECCF") + gDish("cake", 570, 140, .95) + gDish("burger", 110, 140, .9) + gDish("smoothie", 570, 390, .9) + gDish("pancakes", 110, 400, .9) },
};
const PIC = {};
function picCanvas(key) {
  if (PIC[key]) return PIC[key];
  return PIC[key] = new Promise(res => {
    const P = PUZZLES[key], W = PZ.BW * PZ.Q, H = PZ.BH * PZ.Q;
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const cx = c.getContext("2d");
    const img = new Image();
    img.onload = () => {
      cx.drawImage(img, 0, 0, W, H);
      if (!P.chef) return res(c);
      // фото Артёма-повара поверх фона
      const ch = new Image();
      ch.onload = () => { const h = 490 * PZ.Q, w = ch.width * h / ch.height; cx.drawImage(ch, (W - w) / 2, 14 * PZ.Q, w, h); res(c); };
      ch.onerror = () => res(c);
      ch.src = "img/артём-повар.png";
    };
    img.onerror = () => res(c);
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 680 510">${P.svg()}</svg>`);
  });
}

// ---------- форма деталей ----------
function pzEdge(p, x0, y0, x1, y1, s) {
  if (!s) { p.lineTo(x1, y1); return; }
  const dx = x1 - x0, dy = y1 - y0, nx = -dy, ny = dx, out = -s;
  const P = (t, h) => [x0 + dx * t + nx * h * out, y0 + dy * t + ny * h * out];
  p.lineTo(...P(0.36, 0));
  p.bezierCurveTo(...P(0.42, 0), ...P(0.43, 0.06), ...P(0.39, 0.12));
  p.bezierCurveTo(...P(0.33, 0.22), ...P(0.45, 0.26), ...P(0.50, 0.26));
  p.bezierCurveTo(...P(0.55, 0.26), ...P(0.67, 0.22), ...P(0.61, 0.12));
  p.bezierCurveTo(...P(0.57, 0.06), ...P(0.58, 0), ...P(0.64, 0));
  p.lineTo(x1, y1);
}
function pzEdges() {
  const r = () => (Math.random() < .5 ? 1 : -1), h = [], v = [];
  for (let i = 0; i < PZ.ROWS - 1; i++) h.push(Array.from({ length: PZ.COLS }, r));
  for (let i = 0; i < PZ.ROWS; i++) v.push(Array.from({ length: PZ.COLS - 1 }, r));
  return { h, v };
}
function pzPath(r, c, E) {
  const S = PZ.S;
  const top = r === 0 ? 0 : -E.h[r - 1][c];
  const right = c === PZ.COLS - 1 ? 0 : E.v[r][c];
  const bottom = r === PZ.ROWS - 1 ? 0 : E.h[r][c];
  const left = c === 0 ? 0 : -E.v[r][c - 1];
  const p = new Path2D();
  p.moveTo(0, 0);
  pzEdge(p, 0, 0, S, 0, top); pzEdge(p, S, 0, S, S, right); pzEdge(p, S, S, 0, S, bottom); pzEdge(p, 0, S, 0, 0, left);
  p.closePath();
  return p;
}
function pzRender(p, pic) {
  const { S, M, Q, BW, BH } = PZ, W = S + 2 * M;
  const cv = document.createElement("canvas");
  cv.width = W * Q; cv.height = W * Q; cv.style.width = W + "px"; cv.style.height = W + "px";
  cv.className = "piece";
  const ctx = cv.getContext("2d");
  ctx.scale(Q, Q); ctx.translate(M, M);
  ctx.save(); ctx.clip(p.path);
  ctx.drawImage(pic, -p.c * S, -p.r * S, BW, BH);
  ctx.lineJoin = "round";
  ctx.save(); ctx.translate(2.5, 2.5); ctx.lineWidth = 4; ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.stroke(p.path); ctx.restore();
  ctx.save(); ctx.translate(-2.5, -2.5); ctx.lineWidth = 4; ctx.strokeStyle = "rgba(40,20,5,.35)"; ctx.stroke(p.path); ctx.restore();
  ctx.restore();
  ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(60,30,8,.6)"; ctx.stroke(p.path);
  return cv;
}

// ---------- игра ----------
const PZS = { pieces: [], drag: null, busy: true, z: 100 };
const pzHit = document.createElement("canvas").getContext("2d");
function puzzleClear() {
  PZS.pieces.forEach(p => p.el.remove());
  PZS.pieces = []; PZS.drag = null; PZS.busy = true;
}
function pzSet(p, x, y) { p.x = x; p.y = y; p.el.style.transform = `translate(${x}px, ${y}px)`; }
function pzDots() {
  const done = PZS.pieces.filter(p => p.placed).length;
  $("pdots").innerHTML = PZS.pieces.map((_, i) => `<div class="dot${i < done ? " on" : ""}"></div>`).join("");
  return done;
}
async function startPuzzle(key) {
  cleanup();
  show("puzzle");
  G.key = key; G.mode = "puzzle";
  const gen = G.gen;
  const pic = await picCanvas(key);
  if (gen !== G.gen) return;
  const { S, M, Q, BX, BY, ROWS, COLS } = PZ;
  for (const id of ["pghost", "plines", "pfull"]) { const cv = $(id); cv.width = PZ.BW * Q; cv.height = PZ.BH * Q; }
  $("pghost").getContext("2d").drawImage(pic, 0, 0);
  $("pfull").getContext("2d").drawImage(pic, 0, 0);
  $("pboard").classList.remove("done");
  $("pword").classList.remove("on");
  $("pword").textContent = PUZZLES[key].word;
  const E = pzEdges();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const p = { r, c, placed: false, path: pzPath(r, c, E) };
    p.tx = BX + c * S - M; p.ty = BY + r * S - M;
    p.el = pzRender(p, pic);
    p.el.style.zIndex = ++PZS.z;
    $("puzzle").appendChild(p.el);
    pzSet(p, p.tx, p.ty);
    PZS.pieces.push(p);
  }
  const lines = $("plines").getContext("2d");
  lines.lineWidth = 2.5; lines.strokeStyle = "rgba(60,30,8,.55)"; lines.lineJoin = "round";
  for (const p of PZS.pieces) { lines.setTransform(Q, 0, 0, Q, p.c * S * Q, p.r * S * Q); lines.stroke(p.path); }
  pzDots();
  say("puz_start");
  // сначала целая картинка, потом детали разлетаются по бокам
  setTimeout(() => {
    if (gen !== G.gen) return;
    const slots = [];
    for (const cx of [125, 325, 1275, 1475]) for (const cy of [260, 530, 800]) slots.push([cx - S / 2 - M + rnd(-15, 15), cy - S / 2 - M + rnd(-15, 15)]);
    slots.sort(() => Math.random() - .5);
    PZS.pieces.forEach((p, i) => { p.el.classList.add("fly"); setTimeout(() => pzSet(p, slots[i][0], slots[i][1]), i * 45); });
    SFX.whoosh();
    setTimeout(() => { if (gen !== G.gen) return; PZS.pieces.forEach(p => p.el.classList.remove("fly")); PZS.busy = false; }, 1350);
  }, 1400);
}
function pzFind(pt) {
  const { M } = PZ;
  return PZS.pieces.filter(p => !p.placed).sort((a, b) => b.el.style.zIndex - a.el.style.zIndex)
    .find(p => pzHit.isPointInPath(p.path, pt.x - p.x - M, pt.y - p.y - M));
}
$("puzzle").addEventListener("pointerdown", e => {
  ac();
  if (PZS.busy) return;
  const pt = toStage(e.clientX, e.clientY), p = pzFind(pt);
  if (!p) return;
  e.preventDefault();
  PZS.drag = { p, ox: pt.x - p.x, oy: pt.y - p.y };
  p.el.style.zIndex = ++PZS.z;
  p.el.classList.add("lift");
  try { $("puzzle").setPointerCapture(e.pointerId); } catch (err) {}
  SFX.pop();
});
$("puzzle").addEventListener("pointermove", e => {
  const d = PZS.drag; if (!d) return;
  const pt = toStage(e.clientX, e.clientY), { S, M } = PZ;
  pzSet(d.p, Math.max(-M, Math.min(1600 - S - M, pt.x - d.ox)), Math.max(-M, Math.min(1000 - S - M, pt.y - d.oy)));
});
function pzDrop() {
  const d = PZS.drag; if (!d) return;
  PZS.drag = null;
  const p = d.p;
  p.el.classList.remove("lift");
  if (Math.hypot(p.x - p.tx, p.y - p.ty) < PZ.SNAP) {
    p.placed = true;
    p.el.classList.add("snap", "placed");
    p.el.style.zIndex = 10;
    pzSet(p, p.tx, p.ty);
    setTimeout(() => p.el.classList.remove("snap"), 200);
    tone(660, 660, .1, "sine", .2); tone(990, 990, .16, "sine", .16, .08);
    if (pzDots() === PZS.pieces.length) pzFinish();
  } else SFX.boing();
}
$("puzzle").addEventListener("pointerup", pzDrop);
$("puzzle").addEventListener("pointercancel", pzDrop);
async function pzFinish() {
  PZS.busy = true;
  const gen = G.gen;
  await sleep(350);
  $("pboard").classList.add("done");
  $("pword").classList.add("on");
  SFX.sparkle();
  await say("puz_done");
  if (gen !== G.gen) return;
  await say(PUZZLES[G.key].say);
  if (gen !== G.gen) return;
  await sleep(500);
  if (gen === G.gen) win(true);
}

function openPuzzles() {
  cleanup();
  show("pmenu");
  const done = readDone("kuhnya-artema-puz");
  $("pics").innerHTML = Object.keys(PUZZLES).map(k => `
    <button class="pic-card" data-k="${k}" aria-label="${PUZZLES[k].word}">
      <span class="thumb"><canvas width="${PZ.BW}" height="${PZ.BH}"></canvas></span>
      <span class="stars">${STAR.repeat(Math.min(5, done[k] || 0))}</span>
    </button>`).join("");
  $("pics").querySelectorAll(".pic-card").forEach(b => {
    const k = b.dataset.k;
    picCanvas(k).then(c => b.querySelector("canvas").getContext("2d").drawImage(c, 0, 0, PZ.BW, PZ.BH));
    b.addEventListener("click", () => { SFX.pop(); startPuzzle(k); });
  });
}

show("start");
